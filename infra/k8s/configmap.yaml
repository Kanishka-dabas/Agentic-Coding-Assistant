apiVersion: v1
kind: ConfigMap
metadata:
  name: agentic-config
  namespace: agentic-coding-assistant
data:
  GROQ_MODEL: "openai/gpt-oss-120b"
  BACKEND_HOST: "0.0.0.0"
  BACKEND_PORT: "8000"
  ENVIRONMENT: "production"
  QDRANT_HOST: "qdrant-service"
  POSTGRES_URL: "postgresql://postgres:postgres@postgres-service:5432/agentic"
---
apiVersion: v1
kind: Secret
metadata:
  name: agentic-secrets
  namespace: agentic-coding-assistant
type: Opaque
stringData:
  GROQ_API_KEY: "REPLACE_WITH_ACTUAL_KEY"
  LANGSMITH_API_KEY: "REPLACE_WITH_ACTUAL_KEY"