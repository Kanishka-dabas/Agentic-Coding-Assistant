services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=agentic
    volumes:
      - pgdata:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant
    restart: unless-stopped
    volumes:
      - qdrant_storage:/qdrant/storage

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - QDRANT_HOST=qdrant
      - SANDBOX_HOST_PATH=/home/ubuntu/sandbox_tmp
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/ubuntu/sandbox_tmp:/sandbox_tmp
    depends_on:
      - postgres
      - qdrant

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  pgdata:
  qdrant_storage: