  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - QDRANT_HOST=qdrant
      - SANDBOX_HOST_PATH=/home/ubuntu/sandbox_tmp
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/ubuntu/sandbox_tmp:/sandbox_tmp
    depends_on:
      - postgres
      - qdrant